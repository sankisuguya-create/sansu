<!doctype html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>何倍でしょう 図</title>
<style>
:root{
  /* 教科書の紙面ふう。値は color-coding の check-palette.mjs で検査済み（背景 #FAF8F3）
     本文16.4・青6.2・補助7.7（塗りの上でも5.9以上）・塗りは背景比1.3、2色覚でも見分け可 */
  --ink:#1A1A1A;--ink-sub:#4A5058;--ink-link:#0F5EA8;--ink-alert:#C0330A;
  --fill-a:#C9DFF4;--fill-b:#F8D99A;--paper:#FAF8F3;
  --line:#B9B2A0;--bg:var(--paper);
  --font:"BIZ UDPGothic","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans CJK JP","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","IPAexGothic","IPAGothic",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:1.5px solid var(--ink-sub);background:var(--paper);border-radius:2px;min-height:44px;padding:4px 14px;touch-action:manipulation}
button:hover{background:#EFEBE0}
button:disabled{opacity:.35;cursor:not-allowed}
button.primary{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:700}
button.primary:hover{background:#333}
button[aria-pressed="true"]{font-weight:700;box-shadow:inset 0 -4px 0 var(--ink)}

header{flex:none;display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--paper);border-bottom:2px solid var(--ink);flex-wrap:wrap}
header h1{font-size:18px;margin:0 6px 0 2px;white-space:nowrap}
header select{min-height:44px;font-size:17px;border:1.5px solid var(--ink-sub);border-radius:2px;padding:0 8px;max-width:46vw;background:var(--paper)}
header .sp{flex:1}
.seg{display:inline-flex}
.seg button{border-radius:0;margin-left:-1px}


#problem{flex:none;font-size:calc(clamp(20px,2.6vw,34px) * var(--fs,1));line-height:1.55;padding:12px 24px 4px;font-weight:500;display:flex;gap:.5em;align-items:flex-start}
#pno{flex:none;background:var(--ink);color:var(--paper);font-weight:700;font-size:.7em;padding:.1em .45em;margin-top:.3em;line-height:1.4;white-space:nowrap}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 24px}
#stage svg{flex:1;min-height:0;width:100%;background:transparent}
#tapeSvg+#relSvg{border-top:1px solid var(--line)}
#stage svg[hidden]{display:none}
#eq{flex:none;min-height:1.6em;font-size:calc(clamp(22px,3vw,40px) * var(--fs,1));font-weight:700;padding:2px 24px;display:flex;gap:1.4em;flex-wrap:wrap}
#eq .ans{color:var(--ink-link)}
.u{color:var(--ink-link)}

footer{flex:none;display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--paper)}
footer button{min-height:56px;font-size:20px;min-width:120px}
/* 段階：1本の線の上の点。済＝黒丸、いま＝大きな黒丸＋太字、まだ＝白丸 */
#steps{flex:1;display:flex;justify-content:center;align-items:center;background:linear-gradient(var(--ink-sub),var(--ink-sub)) no-repeat center 14px/70% 2px}
#steps button{min-width:0;min-height:48px;font-size:16px;padding:22px 14px 2px;border:none;background:none;position:relative;color:var(--ink-sub)}
#steps button::before{content:"";position:absolute;top:7px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;border:2px solid var(--ink-sub);background:var(--paper)}
#steps button.done{color:var(--ink)}
#steps button.done::before{background:var(--ink);border-color:var(--ink)}
#steps button.cur{color:var(--ink);font-weight:700}
#steps button.cur::before{background:var(--ink);border-color:var(--ink);width:20px;height:20px;margin-left:-10px;top:4px}

/* SVG */
.tape{stroke:var(--ink);stroke-width:2.5}
.f0{fill:var(--fill-a)} .f1{fill:var(--fill-b)} .f2{fill:#fff}  /* 3つめは白：背景と近いので太い枠で区別 */
.tx{font-family:var(--font);fill:var(--ink)}
.unk{fill:var(--ink-link);font-weight:700}
.rev{fill:var(--ink-link);font-weight:700}
.div{stroke:var(--ink);stroke-width:2.5}
.div.fine{stroke-dasharray:6 5;stroke-width:2}
.cnt{font-family:var(--font);fill:var(--ink-sub);font-weight:700}
.arrow{stroke:var(--ink);stroke-width:3;fill:none}
.arrow.big{stroke:var(--ink-link);stroke-width:3.5}
.pop{animation:pop .3s ease-out both}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.zero{stroke:var(--ink);stroke-width:3}
.axis{stroke:var(--ink);stroke-width:2.5}
.guide{stroke:var(--ink-sub);stroke-width:1.5;stroke-dasharray:4 5}
.ph{font-family:var(--font);fill:var(--ink-sub)}
.mk-arr{position:relative;white-space:nowrap}   /* 行をまたぐと矢印の先が別の行に飛ぶ */
.mk-box{margin:0 .15em;white-space:nowrap}
.mk-arr.on{background:linear-gradient(var(--ink-alert),var(--ink-alert)) no-repeat left 100%/calc(100% - .35em) 4px;padding-bottom:6px;margin-right:.55em}
.mk-arr.on::after{content:"";position:absolute;right:-.3em;bottom:-4px;border-left:.6em solid var(--ink-alert);border-top:7px solid transparent;border-bottom:7px solid transparent;animation:pop .3s both}
.mk-box.on{outline:4px solid var(--ink-alert);outline-offset:3px;animation:pop .3s both}

/* 作成ダイアログ */
dialog{border:2px solid var(--ink);border-radius:2px;background:var(--paper);padding:18px 22px;max-width:min(720px,94vw);box-shadow:0 10px 40px rgba(0,0,0,.25)}
dialog h2{margin:0 0 10px;font-size:20px}
dialog fieldset{border:1px solid var(--line);border-radius:10px;margin:0 0 10px;padding:8px 12px}
dialog legend{font-weight:700;padding:0 4px}
.row{display:flex;align-items:center;gap:8px;margin:6px 0;flex-wrap:wrap}
.row input[type=text],.row input[type=number]{min-height:42px;border:1px solid #c3ccd7;border-radius:8px;padding:0 8px;font-size:18px}
.row input[type=number]{width:6em}
.row input.nm{width:9em}
.row label.q{display:flex;align-items:center;gap:4px;min-height:42px;padding:0 8px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.row input[type=number]:disabled{background:var(--fill-a);color:var(--ink-link);font-weight:700}
#cMsg{min-height:1.4em;font-weight:700}
#cMsg.err{color:var(--ink-alert)}
.dbtn{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
:fullscreen header,:fullscreen footer{display:none}   /* 児童に見せる時は操作部分を消す。進めるのはキー・リモコン・画面タップ */
:fullscreen #problem{padding-top:28px}
:fullscreen #eq{padding-bottom:20px}

/* 画面の切り替え：メニュー／図／設定 */
.screen{flex:1;min-height:0;display:flex;flex-direction:column}
.screen[hidden]{display:none}
.page{flex:1;overflow:auto;padding:16px 24px 32px}
.page h2{font-size:20px;margin:22px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--ink)}
.page h2:first-child{margin-top:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.card{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 14px;min-height:88px;border:1.5px solid var(--ink-sub);background:#fff;width:100%}
.card:hover{background:#F3EFE4}
.card .no{flex:none;background:var(--ink);color:var(--paper);font-weight:700;padding:.05em .4em;font-size:15px}
.card .t{font-weight:700;font-size:17px}
.card .s{font-size:14px;color:var(--ink-sub);margin-top:4px;line-height:1.5}
.cwrap{display:flex;gap:6px}
.cwrap .card{flex:1}
button.del{color:var(--ink-alert);border-color:var(--ink-alert);flex:none;align-self:stretch}
.empty{color:var(--ink-sub)}
.mbar{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.mbar button{min-height:56px;font-size:18px;padding:4px 20px}
.opts{display:flex;gap:0;flex-wrap:wrap}
.opts button{border-radius:0;margin-left:-1.5px;min-height:56px;font-size:18px;padding:4px 20px}
#fsSample{margin-top:14px;border:1px solid var(--line);background:#fff;padding:12px 18px;font-size:calc(clamp(20px,2.6vw,34px) * var(--fs,1));line-height:1.55}
</style>
</head>
<body>
<section id="menu" class="screen">
  <header><h1>何倍でしょう 図</h1><span class="sp"></span><button id="mSet">設定</button></header>
  <div class="page">
    <h2>教科書の問題</h2>
    <div class="cards" id="mPre"></div>
    <h2>自作の問題</h2>
    <div class="cards" id="mCus"></div>
    <div class="mbar"><button id="mMake" class="primary">＋ 問題をつくる</button></div>
  </div>
</section>

<section id="settings" class="screen" hidden>
  <header><button id="sBack">◀ もどる</button><h1>設定</h1></header>
  <div class="page">
    <h2>文字の大きさ（問題文・式・図）</h2>
    <div class="opts" id="fsOpts" role="group" aria-label="文字の大きさ"></div>
    <div id="fsSample">黄の車が走った長さは、赤の車が走った長さの何倍ですか。<br>2 × □ = 12</div>
  </div>
</section>

<section id="viewer" class="screen" hidden>
<header>
  <button id="bMenu">◀ メニュー</button>
  <span class="sp"></span>
  <span class="seg" role="group" aria-label="表示">
    <button data-v="both" aria-pressed="true">両方</button><button data-v="tape" aria-pressed="false">テープ図だけ</button><button data-v="rel" aria-pressed="false">関係図だけ</button>
  </span>
  <button id="bFull">全画面</button>
</header>

<div id="problem"><span id="pno"></span><span id="ptext"></span></div>
<div id="stage">
  <svg id="tapeSvg" viewBox="0 0 1000 310" preserveAspectRatio="xMidYMid meet" aria-label="テープ図"></svg>
  <svg id="relSvg" viewBox="0 0 1000 230" preserveAspectRatio="xMidYMid meet" aria-label="関係図"></svg>
</div>
<div id="eq"></div>
<footer>
  <button id="bPrev">◀ もどる</button>
  <div id="steps"></div>
  <button id="bNext" class="primary">つぎへ ▶</button>
</footer>
</section>

<dialog id="dlg">
  <h2>問題をつくる</h2>
  <fieldset><legend>量の数</legend>
    <div class="row">
      <label class="q"><input type="radio" name="kind" value="2" checked> 2つ（〇倍・もとにする量）</label>
      <label class="q"><input type="radio" name="kind" value="3"> 3つ（〇倍の〇倍）</label>
    </div>
  </fieldset>
  <fieldset><legend>たんい</legend>
    <div class="row"><input type="text" id="cUnit" value="m" style="width:6em" aria-label="たんい"> <span style="color:var(--ink-sub)">例：m、L、こ、kg</span></div>
  </fieldset>
  <fieldset id="f2"><legend>□にするところを1つえらぶ</legend>
    <div class="row"><input class="nm" type="text" id="n0" value="赤" aria-label="もとにする量の名前"> は <input type="number" id="a2" value="2" min="1"> <span class="cu"></span><label class="q"><input type="radio" name="unk" value="a"> □</label></div>
    <div class="row"><input class="nm" type="text" id="n1" value="黄" aria-label="くらべる量の名前"> は <input type="number" id="b2" value="12" min="1"> <span class="cu"></span><label class="q"><input type="radio" name="unk" value="b"> □</label></div>
    <div class="row">もとにする量の <input type="number" id="k2" value="6" min="2"> 倍 <label class="q"><input type="radio" name="unk" value="k" checked> □</label></div>
  </fieldset>
  <fieldset id="f3" hidden><legend>3つの量（3つめの量を□にする）</legend>
    <div class="row"><input class="nm" type="text" id="m0" value="赤" aria-label="1つめの名前"> は <input type="number" id="a3" value="4" min="1"> <span class="cu"></span></div>
    <div class="row"><input class="nm" type="text" id="m1" value="青" aria-label="2つめの名前"> は 1つめの <input type="number" id="k31" value="3" min="2"> 倍</div>
    <div class="row"><input class="nm" type="text" id="m2" value="黄" aria-label="3つめの名前"> は 2つめの <input type="number" id="k32" value="2" min="2"> 倍</div>
  </fieldset>
  <div id="cMsg"></div>
  <div class="dbtn"><button id="cCancel">やめる</button><button id="cOk" class="primary">この問題で図を出す</button></div>
</dialog>
