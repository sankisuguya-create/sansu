<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>何倍でしょう 図</title>
<style>
:root{
  /* 教科書の紙面ふう。値は color-coding の check-palette.mjs で検査済み（背景 #FAF8F3）
     本文16.4・青6.2・補助7.7（塗りの上でも5.9以上）・塗りは背景比1.3、2色覚でも見分け可 */
  --ink:#1A1A1A;--ink-sub:#4A5058;--ink-link:#0F5EA8;--ink-alert:#C0330A;
  --fill-a:#C9DFF4;--fill-b:#F8D99A;--paper:#FAF8F3;
  --line:#B9B2A0;--bg:var(--paper);
  --font:"BIZ UDPGothic","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans CJK JP","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","IPAexGothic","IPAGothic",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:1.5px solid var(--ink-sub);background:var(--paper);border-radius:2px;min-height:44px;padding:4px 14px;touch-action:manipulation}
button:hover{background:#EFEBE0}
button:disabled{opacity:.35;cursor:not-allowed}
button.primary{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:700}
button.primary:hover{background:#333}
button[aria-pressed="true"]{font-weight:700;box-shadow:inset 0 -4px 0 var(--ink)}

header{flex:none;display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--paper);border-bottom:2px solid var(--ink);flex-wrap:wrap}
header h1{font-size:18px;margin:0 6px 0 2px;white-space:nowrap}
header select{min-height:44px;font-size:17px;border:1.5px solid var(--ink-sub);border-radius:2px;padding:0 8px;max-width:46vw;background:var(--paper)}
header .sp{flex:1}
.seg{display:inline-flex}
.seg button{border-radius:0;margin-left:-1px}


#problem{flex:none;font-size:clamp(20px,2.6vw,34px);line-height:1.55;padding:12px 24px 4px;font-weight:500;display:flex;gap:.5em;align-items:flex-start}
#pno{flex:none;background:var(--ink);color:var(--paper);font-weight:700;font-size:.7em;padding:.1em .45em;margin-top:.3em;line-height:1.4;white-space:nowrap}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 24px}
#stage svg{flex:1;min-height:0;width:100%;background:transparent}
#tapeSvg+#relSvg{border-top:1px solid var(--line)}
#stage svg[hidden]{display:none}
#eq{flex:none;min-height:1.6em;font-size:clamp(22px,3vw,40px);font-weight:700;padding:2px 24px;display:flex;gap:1.4em;flex-wrap:wrap}
#eq .ans{color:var(--ink-link)}
.u{color:var(--ink-link)}

footer{flex:none;display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--paper)}
footer button{min-height:56px;font-size:20px;min-width:120px}
/* 段階：1本の線の上の点。済＝黒丸、いま＝大きな黒丸＋太字、まだ＝白丸 */
#steps{flex:1;display:flex;justify-content:center;align-items:center;background:linear-gradient(var(--ink-sub),var(--ink-sub)) no-repeat center 14px/70% 2px}
#steps button{min-width:0;min-height:48px;font-size:16px;padding:22px 14px 2px;border:none;background:none;position:relative;color:var(--ink-sub)}
#steps button::before{content:"";position:absolute;top:7px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;border:2px solid var(--ink-sub);background:var(--paper)}
#steps button.done{color:var(--ink)}
#steps button.done::before{background:var(--ink);border-color:var(--ink)}
#steps button.cur{color:var(--ink);font-weight:700}
#steps button.cur::before{background:var(--ink);border-color:var(--ink);width:20px;height:20px;margin-left:-10px;top:4px}

/* SVG */
.tape{stroke:var(--ink);stroke-width:2.5}
.f0{fill:var(--fill-a)} .f1{fill:var(--fill-b)} .f2{fill:#fff}  /* 3つめは白：背景と近いので太い枠で区別 */
.tx{font-family:var(--font);fill:var(--ink)}
.unk{fill:var(--ink-link);font-weight:700}
.rev{fill:var(--ink-link);font-weight:700}
.div{stroke:var(--ink);stroke-width:2.5}
.div.fine{stroke-dasharray:6 5;stroke-width:2}
.cnt{font-family:var(--font);fill:var(--ink-sub);font-weight:700}
.arrow{stroke:var(--ink);stroke-width:3;fill:none}
.arrow.big{stroke:var(--ink-link);stroke-width:3.5}
.pop{animation:pop .3s ease-out both}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.zero{stroke:var(--ink);stroke-width:3}
.axis{stroke:var(--ink);stroke-width:2.5}
.guide{stroke:var(--ink-sub);stroke-width:1.5;stroke-dasharray:4 5}
.ph{font-family:var(--font);fill:var(--ink-sub)}
.mk-arr{position:relative}
.mk-box{margin:0 .15em}
.mk-arr.on{background:linear-gradient(var(--ink-alert),var(--ink-alert)) no-repeat left 100%/calc(100% - .35em) 4px;padding-bottom:6px;margin-right:.55em}
.mk-arr.on::after{content:"";position:absolute;right:-.3em;bottom:-4px;border-left:.6em solid var(--ink-alert);border-top:7px solid transparent;border-bottom:7px solid transparent;animation:pop .3s both}
.mk-box.on{outline:4px solid var(--ink-alert);outline-offset:3px;animation:pop .3s both}

/* 作成ダイアログ */
dialog{border:2px solid var(--ink);border-radius:2px;background:var(--paper);padding:18px 22px;max-width:min(720px,94vw);box-shadow:0 10px 40px rgba(0,0,0,.25)}
dialog h2{margin:0 0 10px;font-size:20px}
dialog fieldset{border:1px solid var(--line);border-radius:10px;margin:0 0 10px;padding:8px 12px}
dialog legend{font-weight:700;padding:0 4px}
.row{display:flex;align-items:center;gap:8px;margin:6px 0;flex-wrap:wrap}
.row input[type=text],.row input[type=number]{min-height:42px;border:1px solid #c3ccd7;border-radius:8px;padding:0 8px;font-size:18px}
.row input[type=number]{width:6em}
.row input.nm{width:9em}
.row label.q{display:flex;align-items:center;gap:4px;min-height:42px;padding:0 8px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.row input[type=number]:disabled{background:var(--fill-a);color:var(--ink-link);font-weight:700}
#cMsg{min-height:1.4em;font-weight:700}
#cMsg.err{color:var(--ink-alert)}
.dbtn{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
:fullscreen header{display:none}
</style>
</head>
<body>
<header>
  <h1>何倍でしょう 図</h1>
  <select id="sel" aria-label="問題"></select>
  <button id="bMake">問題をつくる</button>
  <span class="sp"></span>
  <span class="seg" role="group" aria-label="表示">
    <button data-v="both" aria-pressed="true">両方</button><button data-v="tape" aria-pressed="false">テープ図だけ</button><button data-v="rel" aria-pressed="false">関係図だけ</button>
  </span>
  <button id="bFull">全画面</button>
</header>

<div id="problem"><span id="pno"></span><span id="ptext"></span></div>
<div id="stage">
  <svg id="tapeSvg" viewBox="0 0 1000 310" preserveAspectRatio="xMidYMid meet" aria-label="テープ図"></svg>
  <svg id="relSvg" viewBox="0 0 1000 230" preserveAspectRatio="xMidYMid meet" aria-label="関係図"></svg>
</div>
<div id="eq"></div>
<footer>
  <button id="bPrev">◀ もどる</button>
  <div id="steps"></div>
  <button id="bNext" class="primary">つぎへ ▶</button>
</footer>

<dialog id="dlg">
  <h2>問題をつくる</h2>
  <fieldset><legend>量の数</legend>
    <div class="row">
      <label class="q"><input type="radio" name="kind" value="2" checked> 2つ（〇倍・もとにする量）</label>
      <label class="q"><input type="radio" name="kind" value="3"> 3つ（〇倍の〇倍）</label>
    </div>
  </fieldset>
  <fieldset><legend>たんい</legend>
    <div class="row"><input type="text" id="cUnit" value="m" style="width:6em" aria-label="たんい"> <span style="color:var(--ink-sub)">例：m、L、こ、kg</span></div>
  </fieldset>
  <fieldset id="f2"><legend>□にするところを1つえらぶ</legend>
    <div class="row"><input class="nm" type="text" id="n0" value="赤" aria-label="もとにする量の名前"> は <input type="number" id="a2" value="2" min="1"> <span class="cu"></span><label class="q"><input type="radio" name="unk" value="a"> □</label></div>
    <div class="row"><input class="nm" type="text" id="n1" value="黄" aria-label="くらべる量の名前"> は <input type="number" id="b2" value="12" min="1"> <span class="cu"></span><label class="q"><input type="radio" name="unk" value="b"> □</label></div>
    <div class="row">もとにする量の <input type="number" id="k2" value="6" min="2"> 倍 <label class="q"><input type="radio" name="unk" value="k" checked> □</label></div>
  </fieldset>
  <fieldset id="f3" hidden><legend>3つの量（3つめの量を□にする）</legend>
    <div class="row"><input class="nm" type="text" id="m0" value="赤" aria-label="1つめの名前"> は <input type="number" id="a3" value="4" min="1"> <span class="cu"></span></div>
    <div class="row"><input class="nm" type="text" id="m1" value="青" aria-label="2つめの名前"> は 1つめの <input type="number" id="k31" value="3" min="2"> 倍</div>
    <div class="row"><input class="nm" type="text" id="m2" value="黄" aria-label="3つめの名前"> は 2つめの <input type="number" id="k32" value="2" min="2"> 倍</div>
  </fieldset>
  <div id="cMsg"></div>
  <div class="dbtn"><button id="cCancel">やめる</button><button id="cOk" class="primary">この問題で図を出す</button></div>
</dialog>

<script>
'use strict';
/* ===== 問題データ（単一真実源） =====
 kind 2: q=[もとにする量, くらべる量], k=倍, unk='a'|'b'|'k'
 kind 3: q=[1つめ, 2つめ, 3つめ], ks=[k1,k2], 3つめを求める。val は真の値（□でも図の長さに使う）
 text の [ ] は赤い四角で囲む所（関係図の左の四角に入るもの）、{ } は赤い矢印の下線を引く所（「の〇倍」） */
var PRESETS = [
  {label:'1時 導入 p.13（赤→青）', kind:2, unk:'b', unit:'m', q:['赤','青'], a:2, k:3,
   text:'赤の車は2m走りました。青の車が走った長さは、[赤の車が走った長さ]{の3倍}でした。青の車は何m走りましたか。'},
  {label:'1時 p.14（赤 2m・黄 12m）', kind:2, unk:'k', unit:'m', q:['赤','黄'], a:2, k:6,
   text:'赤の車は2m、黄の車は12m走りました。黄の車が走った長さは、[赤の車が走った長さ]{の何倍}ですか。'},
  {label:'1時 p.15（ふくろ 6こ・かん 30こ）', kind:2, unk:'k', unit:'こ', q:['ふくろ','かん'], a:6, k:5,
   text:'ふくろには6こ、かんには30このあめがはいっています。かんのあめの数は、[ふくろのあめの数]{の何倍}ですか。'},
  {label:'2時 p.16（緑 □m・黄 12m）', kind:2, unk:'a', unit:'m', q:['緑','黄'], a:4, k:3,
   text:'黄の車は12m走りました。黄の車が走った長さは、[緑の車が走った長さ]{の3倍}でした。緑の車は何m走りましたか。'},
  {label:'2時 p.17（バケツ □L・水そう 48L）', kind:2, unk:'a', unit:'L', q:['バケツ','水そう'], a:6, k:8,
   text:'水そうにはいる水は48Lで、[バケツにはいる水]{の8倍}です。バケツにはいる水は何Lですか。'},
  {label:'3時 p.18（赤 4m → 3倍 → 2倍）', kind:3, unit:'m', q:['赤','青','黄'], a:4, ks:[3,2],
   text:'赤の車は4m走りました。青の車は[赤の車]{の3倍}、黄の車は[青の車]{の2倍}走りました。黄の車は何m走りましたか。'},
  {label:'4時 p.19（ペットボトル 2L → 4倍 → 2倍）', kind:3, unit:'L', q:['ペットボトル','バケツ','水そう'], a:2, ks:[4,2],
   text:'ペットボトルには水が2Lはいります。バケツには[ペットボトル]{の4倍}、水そうには[バケツ]{の2倍}の水がはいります。水そうには水が何Lはいりますか。'},
  {label:'4時 p.19（小・中・大の箱）', kind:3, unit:'こ', q:['小','中','大'], a:2, ks:[3,2],
   text:'小の箱にはケーキが2こはいります。中の箱には[小の箱]{の3倍}、大の箱には[中の箱]{の2倍}はいります。大の箱にはケーキが何こはいりますか。'}
];
/* 段階の順（利用者の指定）：問題文 → テープ図（もと→目盛り→くらべる）→ 問題文に下線・囲み
   → 関係図（枠→〇倍→左→右→下の数）→ 式 → 答え */
var STEPS = {
  2:['問題','もと','目盛り','くらべる','下線','囲む','枠','〇倍','左','右','数','式','答え'],
  3:['問題','1つめ','目盛り','2つめ','3つめ','下線','囲む','枠','〇倍','左','中','右','数','順に','まとめて','答え']
};
var LS_KEY = 'baizu.custom.v1';

var custom = [];
try { custom = JSON.parse(localStorage.getItem(LS_KEY) || '[]') || []; } catch (e) { custom = []; }
var P = null, step = 0, view = {tape:true, rel:true}, VIEW_KEY = 'baizu.view';

function $(id){ return document.getElementById(id); }
function all(){ return PRESETS.concat(custom); }
function vals(p){ return p.kind === 2 ? [p.a, p.a*p.k] : [p.a, p.a*p.ks[0], p.a*p.ks[0]*p.ks[1]]; }
function at(name){ var i = STEPS[P.kind].indexOf(name); return i >= 0 && step >= i; }   // その段まで来たか
function now(name){ return STEPS[P.kind][step] === name; }                               // ちょうどその段か

/* ===== □か値か ===== */
function isUnk(i){ return P.kind === 2 ? (P.unk === 'a' && i === 0) || (P.unk === 'b' && i === 1) : i > 0; }
function revealed(){ return P.kind === 2 ? at('答え') : at('順に'); }   // 量が3つの時は「順に」の式で求まる
function shownVal(i){ return isUnk(i) && !revealed() ? null : vals(P)[i]; }
function shownK(){ return P.unk === 'k' && !at('答え') ? null : P.k; }

/* ===== SVG ===== */
var NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, text){
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
}
function label(svg, x, y, v, unit, size, anchor, cls){
  var t = el('text', {x:x, y:y, 'font-size':size, 'text-anchor':anchor||'start', class:'tx'});
  if (v == null){ t.appendChild(el('tspan', {class:'unk'}, '□')); t.appendChild(el('tspan', {}, unit)); }
  else { t.appendChild(el('tspan', {class: cls||''}, String(v))); t.appendChild(el('tspan', {}, unit)); }
  svg.appendChild(t);
  return t;
}
function valCls(i){ return isUnk(i) ? 'rev' : ''; }
function ph(svg, y){ svg.appendChild(el('text',{x:500,y:y,'text-anchor':'middle','font-size':26,class:'ph'},'「つぎへ」で 図が 出ます')); }

function drawTape(){
  var svg = $('tapeSvg'); svg.innerHTML = '';
  var n = P.kind, v = vals(P), X0 = 140, W = 740, sc = W / v[n-1];
  var rowH = n === 2 ? 95 : 75, top = n === 2 ? 40 : 22, th = 36;
  var rowStep = n === 2 ? ['もと','くらべる'] : ['1つめ','2つめ','3つめ'];
  var vis = rowStep.map(at);
  if (!vis[0]){ ph(svg, 130); return; }
  var yA = top + (n-1)*rowH + th + 48;   // 目盛りの線

  // 0の縦線
  svg.appendChild(el('line', {x1:X0, x2:X0, y1:top-10, y2:at('目盛り') ? yA+8 : top+th+10, class:'zero'}));

  // テープ（くらべる量は、もとにする量の長さで区切って出す。番号はテープの中に書かない）
  function divide(row, unitLen, count, cls, anim){
    var y = top + row*rowH;
    for (var j = 1; j < count; j++)
      svg.appendChild(el('line', {x1:X0+j*unitLen*sc, x2:X0+j*unitLen*sc, y1:y, y2:y+th, class:'div '+(cls||'')+(anim?' pop':''), style: anim ? 'animation-delay:'+(0.25+j*0.3)+'s' : ''}));
  }
  for (var i = 0; i < n; i++){
    if (!vis[i]) continue;
    var y = top + i*rowH, g = el('g', {class: now(rowStep[i]) ? 'pop' : ''});
    svg.appendChild(g);
    g.appendChild(el('text', {x:X0-14, y:y+th/2+10, 'text-anchor':'end', 'font-size':28, class:'tx', 'font-weight':700}, P.q[i]));
    g.appendChild(el('rect', {x:X0, y:y, width:v[i]*sc, height:th, class:'tape f'+i}));
    var sv = shownVal(i);
    label(g, X0 + v[i]*sc + 12, y+th/2+10, sv, P.unit, 28, 'start', sv != null ? valCls(i) : '');
    if (i === 1) divide(1, v[0], n === 2 ? P.k : P.ks[0], '', now(rowStep[1]));
    if (i === 2) divide(2, v[1], P.ks[1], '', now(rowStep[2]));
  }
  if (n === 3 && at('まとめて')) divide(2, v[0], P.ks[0]*P.ks[1], 'fine', now('まとめて'));

  // 目盛りの線と数（目盛りの上に 0(倍), 1, 2, …）
  if (at('目盛り')){
    var g2 = el('g', {class: now('目盛り') ? 'pop' : ''}); svg.appendChild(g2);
    var cnt = Math.round(v[n-1] / v[0]);
    g2.appendChild(el('line', {x1:X0, x2:X0+W+20, y1:yA, y2:yA, class:'axis'}));
    var z = el('text', {x:X0, y:yA+34, 'text-anchor':'middle', 'font-size':24, class:'tx'});
    z.appendChild(el('tspan', {}, '0')); z.appendChild(el('tspan', {'font-size':18, dx:2}, '(倍)'));
    g2.appendChild(z);
    for (var t = 1; t <= cnt; t++){
      var x = X0 + t*v[0]*sc, d = now('目盛り') ? 'animation-delay:'+(t*0.25)+'s' : '';
      g2.appendChild(el('line', {x1:x, x2:x, y1:yA-9, y2:yA+9, class:'axis pop', style:d}));
      g2.appendChild(el('text', {x:x, y:yA+34, 'text-anchor':'middle', 'font-size':24, class:'tx pop', style:d}, String(t)));
    }
    // 各テープの右はしから目盛りの線へ点線
    for (var r = 0; r < n; r++) if (vis[r])
      svg.appendChild(el('line', {x1:X0+v[r]*sc, x2:X0+v[r]*sc, y1:top+r*rowH+th, y2:yA, class:'guide'}));
  }
}

function drawRel(){
  var svg = $('relSvg'); svg.innerHTML = '';
  if (!at('枠')){ ph(svg, 120); return; }
  var n = P.kind, bw = 190, bh = 64, y = 105;
  var xs = n === 2 ? [150, 660] : [60, 405, 750];
  var nameStep = n === 2 ? ['左','右'] : ['左','中','右'];
  for (var i = 0; i < n; i++){
    var g = el('g', {}); svg.appendChild(g);
    g.appendChild(el('rect', {x:xs[i], y:y, width:bw, height:bh, rx:6, class:'tape '+(at(nameStep[i]) ? 'f'+i : 'f2')}));
    if (at(nameStep[i])) g.appendChild(el('text', {x:xs[i]+bw/2, y:y+bh/2+10, 'text-anchor':'middle', 'font-size':28, 'font-weight':700, class:'tx'+(now(nameStep[i])?' pop':'')}, P.q[i]));
    if (at('数')){ var sv = shownVal(i); var t = label(g, xs[i]+bw/2, y+bh+38, sv, P.unit, 28, 'middle', sv != null ? valCls(i) : ''); if (now('数')) t.setAttribute('class','tx pop'); }
  }
  for (var a = 0; a < n-1; a++){
    var x1 = xs[a]+bw+8, x2 = xs[a+1]-8, ga = el('g', {}); svg.appendChild(ga);
    ga.appendChild(el('line', {x1:x1, y1:y+bh/2, x2:x2-14, y2:y+bh/2, class:'arrow'}));
    ga.appendChild(el('path', {d:'M'+x2+' '+(y+bh/2)+' l-18 -10 v20 z', fill:'#1A1A1A'}));
    if (at('〇倍')){
      var k = n === 2 ? shownK() : P.ks[a];
      var t2 = label(ga, (x1+x2)/2, y+bh/2-14, k, '倍', 28, 'middle', n === 2 && P.unk === 'k' && k != null ? 'rev' : '');
      if (now('〇倍')) t2.setAttribute('class','tx pop');
    }
  }
  if (n === 3 && at('まとめて')){
    var p = xs[0]+bw/2, q = xs[2]+bw/2, gm = el('g',{class:'pop'}); svg.appendChild(gm);
    gm.appendChild(el('path', {d:'M'+p+' '+(y-6)+' C'+p+' 60 '+q+' 60 '+q+' '+(y-22), class:'arrow big'}));
    gm.appendChild(el('path', {d:'M'+q+' '+(y-4)+' l-10 -20 h20 z', fill:'#0F5EA8'}));
    gm.appendChild(el('text', {x:500, y:42, 'text-anchor':'middle','font-size':28,class:'tx rev'}, (P.ks[0]*P.ks[1])+'倍（'+P.ks[0]+'×'+P.ks[1]+'）'));
  }
}

/* ===== 問題文（[ ] と { } に印をつける） ===== */
function drawProblem(){
  var box = $('ptext'); box.innerHTML = '';
  var re = /\[([^\]]+)\]|\{([^}]+)\}|[^\[{]+/g, m;
  while ((m = re.exec(P.text))){
    var s = document.createElement('span');
    if (m[1] != null){ s.textContent = m[1]; s.className = 'mk-box' + (at('囲む') ? ' on' : ''); }
    else if (m[2] != null){ s.textContent = m[2]; s.className = 'mk-arr' + (at('下線') ? ' on' : ''); }
    else s.textContent = m[0];
    box.appendChild(s);
  }
}

/* ===== 式 ===== */
function eqLines(){
  var u = P.unit, v = vals(P), L = [];
  var B = '<span class="u">□</span>';
  if (P.kind === 2){
    if (!at('式')) return L;
    var a = P.a, b = v[1], k = P.k, ans = at('答え');
    if (P.unk === 'k'){ L.push(a+' × '+B+' = '+b); if (ans) L.push(b+' ÷ '+a+' = '+k, '<span class="ans">答え '+k+'倍</span>'); }
    if (P.unk === 'b'){ L.push(a+' × '+k+' = '+B); if (ans) L.push('<span class="ans">答え '+b+u+'</span>'); }
    if (P.unk === 'a'){ L.push(B+' × '+k+' = '+b); if (ans) L.push(b+' ÷ '+k+' = '+a, '<span class="ans">答え '+a+u+'</span>'); }
    return L;
  }
  var k1 = P.ks[0], k2 = P.ks[1];
  if (at('順に')) L.push('順に：'+P.a+' × '+k1+' = '+v[1]+'　'+v[1]+' × '+k2+' = '+v[2]);
  if (at('まとめて')) L.push('まとめて：'+k1+' × '+k2+' = '+(k1*k2)+'　'+P.a+' × '+(k1*k2)+' = '+v[2]);
  if (at('答え')) L.push('<span class="ans">答え '+v[2]+u+'</span>');
  return L;
}

function render(){
  var S = STEPS[P.kind];
  var m = /p\.\d+/.exec(P.label); $('pno').textContent = P.custom || !m ? '自作' : m[0];
  drawProblem();
  $('tapeSvg').style.display = view.tape ? '' : 'none'; $('relSvg').style.display = view.rel ? '' : 'none';   // SVG要素には hidden プロパティが無い
  drawTape(); drawRel();
  $('eq').innerHTML = eqLines().map(function(s){ return '<span>'+s+'</span>'; }).join('');
  var st = $('steps'); st.innerHTML = '';
  S.forEach(function(name, i){
    var b = document.createElement('button');
    b.textContent = name; b.className = i === step ? 'cur' : (i < step ? 'done' : '');
    b.onclick = function(){ step = i; render(); };
    st.appendChild(b);
  });
  $('bPrev').disabled = step === 0;
  $('bNext').disabled = step === S.length-1;
}
function go(d){ var n = STEPS[P.kind].length; step = Math.max(0, Math.min(n-1, step+d)); render(); }
function load(i){ P = all()[i]; step = 0; render(); }

function fillSel(keep){
  var s = $('sel'); s.innerHTML = '';
  all().forEach(function(p, i){ var o = document.createElement('option'); o.value = i; o.textContent = p.label; s.appendChild(o); });
  s.value = keep;
}
/* ===== 問題をつくる ===== */
function kind(){ return document.querySelector('input[name=kind]:checked').value === '3' ? 3 : 2; }
function unk(){ return document.querySelector('input[name=unk]:checked').value; }
function num(id){ var x = Number($(id).value); return Number.isInteger(x) && x > 0 ? x : null; }
function readForm(){
  var unit = $('cUnit').value.trim() || '';
  if (kind() === 3){
    var a = num('a3'), k1 = num('k31'), k2 = num('k32'), n = [$('m0').value.trim(), $('m1').value.trim(), $('m2').value.trim()];
    if (!a || !k1 || !k2) return {err:'数は 1 以上の整数で 入れてください'};
    if (k1 < 2 || k2 < 2) return {err:'倍は 2 以上に してください'};
    if (n.some(function(x){ return !x; })) return {err:'名前を 3つとも 入れてください'};
    return {p:{kind:3, unit:unit, q:n, a:a, ks:[k1,k2],
      label:'自作：'+n.join('→')+'（'+a+unit+'・'+k1+'倍・'+k2+'倍）',
      text: n[0]+'は'+a+unit+'です。'+n[1]+'は['+n[0]+']{の'+k1+'倍}、'+n[2]+'は['+n[1]+']{の'+k2+'倍}です。'+n[2]+'は何'+unit+'ですか。'}};
  }
  var u = unk(), n0 = $('n0').value.trim(), n1 = $('n1').value.trim();
  if (!n0 || !n1) return {err:'名前を 2つとも 入れてください'};
  var a = num('a2'), b = num('b2'), k = num('k2');
  if (u === 'k'){ if (!a || !b) return {err:'数を 入れてください'}; if (b % a) return {err:b+' は '+a+' で わり切れません'}; k = b/a; }
  if (u === 'b'){ if (!a || !k) return {err:'数を 入れてください'}; b = a*k; }
  if (u === 'a'){ if (!b || !k) return {err:'数を 入れてください'}; if (b % k) return {err:b+' は '+k+' で わり切れません'}; a = b/k; }
  if (k < 2) return {err:'倍は 2 以上に なるように してください'};
  var text = u === 'k' ? n0+'は'+a+unit+'、'+n1+'は'+b+unit+'です。'+n1+'は['+n0+']{の何倍}ですか。'
           : u === 'b' ? n0+'は'+a+unit+'です。'+n1+'は['+n0+']{の'+k+'倍}です。'+n1+'は何'+unit+'ですか。'
           : n1+'は'+b+unit+'で、['+n0+']{の'+k+'倍}です。'+n0+'は何'+unit+'ですか。';
  return {p:{kind:2, unk:u, unit:unit, q:[n0,n1], a:a, k:k, text:text,
    label:'自作：'+n0+'・'+n1+'（'+(u==='a'?'□':a)+unit+'・'+(u==='b'?'□':b)+unit+'・'+(u==='k'?'□':k)+'倍）'}, a:a, b:b, k:k};
}
function syncForm(){
  var k3 = kind() === 3;
  $('f2').hidden = k3; $('f3').hidden = !k3;
  document.querySelectorAll('.cu').forEach(function(s){ s.textContent = $('cUnit').value; });
  var u = unk();
  $('a2').disabled = u === 'a'; $('b2').disabled = u === 'b'; $('k2').disabled = u === 'k';
  var r = readForm(), m = $('cMsg');
  if (r.err){ m.textContent = r.err; m.className = 'err'; $('cOk').disabled = true; return; }
  m.className = ''; $('cOk').disabled = false;
  if (!k3){ if (u==='a') $('a2').value = r.a; if (u==='b') $('b2').value = r.b; if (u==='k') $('k2').value = r.k; }
  m.textContent = '答え：' + (k3 ? vals(r.p)[2] + r.p.unit : u==='k' ? r.k+'倍' : u==='a' ? r.a+r.p.unit : r.b+r.p.unit);
}

/* ===== 操作 ===== */
$('sel').onchange = function(){ load(Number(this.value)); this.blur(); };
$('bPrev').onclick = function(){ go(-1); };
$('bNext').onclick = function(){ go(1); };
function setView(m){
  view = {tape: m !== 'rel', rel: m !== 'tape'};
  document.querySelectorAll('.seg button').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.v === m); });
  try { localStorage.setItem(VIEW_KEY, m); } catch (e) {}
  if (P) render();
}
document.querySelectorAll('.seg button').forEach(function(b){ b.onclick = function(){ setView(b.dataset.v); }; });
try { var vm = localStorage.getItem(VIEW_KEY); if (vm === 'tape' || vm === 'rel') setView(vm); } catch (e) {}
$('bFull').onclick = function(){
  if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(function(){});
};
document.addEventListener('keydown', function(e){
  if ($('dlg').open || e.target.tagName === 'SELECT') return;
  if (['ArrowRight','PageDown',' ','Enter'].indexOf(e.key) >= 0){ e.preventDefault(); go(1); }   // プレゼン用リモコンは PageDown を送る
  else if (['ArrowLeft','PageUp','Backspace'].indexOf(e.key) >= 0){ e.preventDefault(); go(-1); }
  else if (e.key === 'f' || e.key === 'F') $('bFull').click();
});
$('bMake').onclick = function(){ syncForm(); $('dlg').showModal(); };
$('cCancel').onclick = function(){ $('dlg').close(); };
$('dlg').addEventListener('input', syncForm);
$('cOk').onclick = function(){
  var r = readForm(); if (r.err) return;
  r.p.custom = true; custom.push(r.p);
  try { localStorage.setItem(LS_KEY, JSON.stringify(custom)); } catch (e) {}
  var i = all().length - 1; fillSel(i); load(i); $('dlg').close();
};

document.documentElement.lang = 'ja';
fillSel(0); load(0);
</script>
</body>
</html>
