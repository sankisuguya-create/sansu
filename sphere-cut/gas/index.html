<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
:root{
  --bg:#f6f4ef; --panel:#ffffff; --ink:#1f2328; --sub:#5b6270; --line:#d9d5cc;
  --accent:#1f4fd1; --bgobj:#e6e1d6; --bgobj2:#dcd6c8; --bgline:#bdb6a6; --knife:#111; --cap:#f3efe6; --good:#b0420c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;overflow:hidden}
#app{display:grid;height:100%;grid-template-columns:1fr 300px;grid-template-rows:auto 1fr auto;
  grid-template-areas:"head side" "stage side" "ctrl side"}
header{grid-area:head;display:flex;align-items:center;gap:12px;padding:10px 16px}
header h1{font-size:22px;margin:0;font-weight:700;letter-spacing:.05em}
header .sp{flex:1}
#stage{grid-area:stage;position:relative;min-height:0;touch-action:none}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#overlay .hit{pointer-events:stroke;cursor:grab}
#overlay .knob{pointer-events:all;cursor:grab}
#hint{position:absolute;left:16px;top:8px;font-size:15px;color:var(--sub);pointer-events:none}
aside{grid-area:side;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
aside h2{font-size:16px;margin:14px 16px 6px;color:var(--sub);font-weight:700}
#cutView{display:block;margin:0 auto;width:220px;height:220px}
#cutText{text-align:center;font-size:22px;font-weight:700;min-height:32px;margin:4px 0 8px}
#hist{flex:1;overflow-y:auto;padding:12px 10px 12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-content:start}
.hi{border:2px solid var(--line);border-radius:10px;padding:4px;text-align:center;background:#fff;cursor:pointer;font-size:13px;position:relative}
.hi.max{border-color:var(--good)}
.hi.max::after{content:"いちばん大きい";position:absolute;left:50%;top:-9px;transform:translateX(-50%);
  background:var(--good);color:#fff;font-size:10px;padding:1px 6px;border-radius:8px;white-space:nowrap}
.hi svg{display:block;margin:0 auto}
footer{grid-area:ctrl;display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;padding:12px 16px;border-top:1px solid var(--line);background:var(--panel)}
.grp{display:flex;flex-direction:column;gap:2px;min-width:220px;flex:1}
.grp label{font-size:15px;font-weight:700}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
input[type=range]{width:100%;height:36px;accent-color:var(--accent)}
button{font:inherit;font-size:18px;font-weight:700;border-radius:12px;border:2px solid var(--ink);background:#fff;color:var(--ink);
  padding:10px 18px;min-height:52px;cursor:pointer}
button.primary{background:var(--ink);color:#fff}
button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.35;cursor:default}
.tog{font-size:15px;min-height:42px;padding:6px 12px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.disabled{opacity:.35;pointer-events:none}
@media (max-width:820px){
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto 230px;grid-template-areas:"head" "stage" "ctrl" "side"}
  aside{border-left:none;border-top:1px solid var(--line);flex-direction:row}
  aside>div{flex:1;min-width:0}
  #cutView{width:150px;height:150px}
}
/* スマホ縦向き：球を最大に、操作は2段に圧縮、記録は横スクロール */
@media (max-width:600px){
  #app{grid-template-rows:auto minmax(0,1fr) auto auto}
  header{padding:8px 12px;gap:6px}
  header h1{font-size:17px}
  .tog{font-size:13px;min-height:36px;padding:4px 8px}
  #hint{font-size:12px;left:12px;top:4px}
  footer{gap:6px 12px;padding:8px 12px}
  .grp{min-width:0;flex:1 1 40%}
  .grp label{font-size:13px}
  input[type=range]{height:30px}
  .scale{font-size:11px}
  .btns{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .btns button{font-size:13px;min-height:46px;padding:4px 2px;border-radius:10px;white-space:nowrap}
  .lg{display:none}
  aside{flex-direction:row;align-items:center;gap:4px;padding:4px 8px 8px}
  aside>div:first-child{flex:0 0 auto}
  aside h2{display:none}
  #cutView{width:96px;height:96px}
  #cutText{font-size:13px;min-height:0;margin:2px 0 0}
  #cutText span{display:none}
  #hist{grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:72px;grid-template-rows:auto;
    overflow-x:auto;overflow-y:hidden;padding:12px 4px 4px}
  .hi{font-size:11px;padding:2px}
  .hi svg{width:44px;height:44px}
}

/* 教師用：履歴スライド */
#slides{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
#slides[hidden]{display:none}
.sbar{display:flex;align-items:center;gap:12px;padding:12px 0}
.sbar h2{margin:0;font-size:24px;flex:1}
#sCount{font-size:20px;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums}
#sBody{flex:1;min-height:0;display:flex;align-items:center;gap:12px;touch-action:pan-y}
.snav{font-size:28px;min-width:60px;min-height:80px;padding:0}
.spanes{flex:1;min-width:0;height:100%;display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:center}
.pane{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;height:100%;justify-content:center}
.pane h3{margin:0;font-size:20px;color:var(--sub)}
.pane svg{width:100%;max-height:calc(100% - 40px);aspect-ratio:1}
#sThumbs{display:flex;gap:8px;overflow-x:auto;padding:12px 0}
.th{min-width:48px;min-height:44px;font-size:16px;padding:0}
.th.on{background:var(--ink);color:#fff}
@media (max-width:600px){
  .spanes{grid-template-columns:1fr;grid-template-rows:1fr 1fr;gap:4px}
  .snav{min-width:40px;font-size:20px}
  .sbar h2{font-size:18px}
}

/* 球をえらぶ画面 */
#picker{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;
  padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
#picker[hidden]{display:none}
#picker h2{margin:0;font-size:32px}
.pk-row{display:grid;grid-template-columns:repeat(3,minmax(0,240px));gap:20px;width:100%;justify-content:center}
.pk{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 12px;border-radius:18px;background:var(--panel);min-height:0}
.pk svg{width:100%;max-width:200px}
.pk-n{font-size:20px;color:var(--sub)}
.pk-t{font-size:28px;font-weight:700;color:var(--accent)}
.sptag{font-size:15px;font-weight:700;color:var(--accent);border:2px solid var(--accent);border-radius:999px;padding:4px 12px;white-space:nowrap}
@media (max-width:600px){
  #picker h2{font-size:24px}
  .pk-row{grid-template-columns:1fr;gap:10px;max-width:340px}
  .pk{flex-direction:row;padding:8px 14px;gap:12px}
  .pk svg{width:110px}
  .pk-t{font-size:22px}
  .sptag{font-size:12px;padding:2px 8px}
}

header{flex-wrap:wrap}
header button{white-space:nowrap}
@media (max-width:600px){
  header h1 span{display:none}
  header .sp{display:none}
  #hint{display:none}
}

#bg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* 切る位置：まんなかに合わせやすく */
.scale{align-items:center}
.scale .mid{font-size:13px;font-weight:700;min-height:30px;padding:2px 10px;border-radius:999px;border:2px solid var(--accent);color:var(--accent);background:var(--panel)}
#gPos.at-center .mid{background:var(--accent);color:#fff}
#gPos.at-center label::after{content:"　まんなか";color:var(--accent)}
.scale{min-height:30px}

/* 切り口スライド：画面の高さに収める（SVGは枠いっぱいに縮小） */
#sBody{min-height:0;overflow:hidden}
.spanes{grid-template-rows:minmax(0,1fr);min-height:0}
.pane{display:grid;grid-template-rows:auto minmax(0,1fr);justify-items:center;min-height:0;height:100%}
.pane svg{width:100%;height:100%;max-height:none;aspect-ratio:auto;min-height:0}
#sThumbs{flex:none}
@media (max-width:600px){ .spanes{grid-template-rows:minmax(0,1fr) minmax(0,1fr)} }
</style>
</head>
<body data-mode="teacher">
<div id="app">
  <header>
    <h1>球を切ってみよう</h1>
    <span class="sp"></span>
    <button class="tog" id="bSlide">切り口スライド</button>
    <button class="tog" id="tReset">向きをもどす</button>
  </header>

  <div id="stage">
    <canvas id="cv"></canvas>
    <svg id="overlay"></svg>
    <div id="hint"></div>
  </div>

  <footer>
    <div class="grp" id="gPos">
      <label for="pos">切る位置</label>
      <input id="pos" type="range" min="-97" max="97" step="1" value="40" list="posTicks">
      <datalist id="posTicks"><option value="0"></option></datalist>
      <div class="scale"><span>はし</span><button type="button" class="mid" id="toCenter">まんなか</button><span>はし</span></div>
    </div>
    <div class="btns">
      <button class="primary" id="bCut">切る</button>
      <button id="bFace" disabled>切り口を見る</button>
      <button id="bBack" disabled>もとにもどす</button>
    </div>
  </footer>

  <aside>
    <div>
      <h2>切り口</h2>
      <svg id="cutView" viewBox="-110 -110 220 220"></svg>
      <div id="cutText"></div>
    </div>
    <div style="display:flex;flex-direction:column;min-height:0">
      <h2>これまでの切り口<span style="font-weight:400;font-size:12px">（おすと同じ切り方にもどる）</span></h2>
      <div id="hist"></div>
    </div>
  </aside>
</div>


<div id="slides" hidden>
  <div class="sbar">
    <h2 id="sTitle"></h2>
    <span id="sCount"></span>
    <button class="tog" id="sClose">とじる</button>
  </div>
  <div id="sBody">
    <button class="snav" id="sPrev" aria-label="前へ">◀</button>
    <div class="spanes">
      <div class="pane"><h3>切り方</h3><svg id="sKnife" viewBox="-130 -130 260 260"></svg></div>
      <div class="pane"><h3>切り口 <small style="font-weight:400;font-size:13px">点線＝球と同じ大きさ</small></h3><svg id="sCut" viewBox="-130 -130 260 260"></svg></div>
    </div>
    <button class="snav" id="sNext" aria-label="次へ">▶</button>
  </div>
  <div id="sThumbs"></div>
</div>
<script>
/* 不具合の原因を画面に出す（GAS環境での診断用） */
(function () {
  function show(msg) {
    var d = document.getElementById('diag');
    if (!d) { d = document.createElement('div'); d.id = 'diag';
      d.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:99;background:#fff3f3;color:#8a1010;border:2px solid #c33;border-radius:8px;padding:10px;font:14px/1.5 sans-serif;white-space:pre-wrap';
      document.body.appendChild(d); }
    d.textContent += msg + '\n';
  }
  window.addEventListener('error', function (e) { show('エラー: ' + e.message + (e.lineno ? ' (行 ' + e.lineno + ':' + e.colno + ')' : '')); });
  window.addEventListener('unhandledrejection', function (e) { show('エラー: ' + (e.reason && e.reason.message || e.reason)); });
  try {
    var c = document.createElement('canvas');
    var gl = c.getContext('webgl2') || c.getContext('webgl');
    if (!gl) show('この端末・ブラウザでは3D表示（WebGL）が使えません。chrome://gpu で「WebGL」の項目を確認してください。');
  } catch (e) { show('WebGLの確認で失敗: ' + e.message); }
  ['error', 'warn'].forEach(function (k) {
    var orig = console[k];
    console[k] = function () {
      try { show('[' + k + '] ' + Array.prototype.map.call(arguments, function (a) { return (a && a.message) || String(a); }).join(' ').slice(0, 600)); } catch (e) {}
      return orig.apply(console, arguments);
    };
  });
  window.__diagShow = show;
})();
</script>
